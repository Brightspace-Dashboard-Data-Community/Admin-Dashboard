<!--
  Brightspace Browser Specific Notification Widget
  Paste into a D2L HTML widget. Shows device-specific notices based on user agent.
-->
<div id="browser-notification-widget" style="font-family: Arial, Helvetica, sans-serif; margin: 0; max-width: 900px;">
  <div id="browser-notification-card" style="display: none; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1em 1.1em; background: #fff; line-height: 1.5;"></div>
</div>
<p><script>
(function () {
  var cardEl = document.getElementById("browser-notification-card");

  var SUPPORT_LINKS = {
    firefox: "https://www.mozilla.org/en-US/firefox/new/",
    chrome: "https://www.google.com/chrome/",
    respondusChromebook: "https://support.respondus.com/hc/en-us/articles/4409604356123-D2L-Brightspace-Cannot-move-past-the-start-quiz-page",
    windowsSMode: "https://support.microsoft.com/en-us/windows/switching-out-of-s-mode-in-windows-4f56d9be-99ec-6983-119f-031bfb28a307#WindowsVersion=Windows_11",
    elearningBooking: "https://outlook.office365.com/owa/calendar/support@yourcollege.edu/bookings/"
  };

  var RESPONDUS_POPUP_URL = "https://respondus1.d2l-partners.brightspace.com";

  function getUserAgent() {
    return String(navigator.userAgent || "").toLowerCase();
  }

  function isIPad() {
    var ua = getUserAgent();
    return /ipad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isIPhone() {
    return /iphone|ipod/.test(getUserAgent());
  }

  function isMacDesktop() {
    var ua = getUserAgent();
    return (/macintosh|mac os x/.test(ua)) && !isIPad() && !isIPhone();
  }

  function isChromebook() {
    var ua = getUserAgent();
    return /cros/.test(ua) || /chromebook/.test(ua);
  }

  function isWindows() {
    return /windows/.test(getUserAgent());
  }

  function link(href, text) {
    return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" style="color:#0056b3;text-decoration:underline;">' + text + '</a>';
  }

  function renderCard(innerHtml, accentColor) {
    cardEl.style.display = "block";
    cardEl.style.borderLeft = "4px solid " + (accentColor || "#990000");
    cardEl.innerHTML = innerHtml;
  }

  function hideCard() {
    cardEl.style.display = "none";
    cardEl.innerHTML = "";
  }

  function macMessage() {
    return (
      '<div style="font-size:15px;font-weight:700;color:#cc0000;margin-bottom:0.45em;">NOTE: Mac users — Safari should not be used for D2L Brightspace</div>' +
      '<div style="font-size:14px;color:#222;">We recommend using ' +
      link(SUPPORT_LINKS.firefox, "Mozilla Firefox") + " or " + link(SUPPORT_LINKS.chrome, "Google Chrome") + ". " +
      "Safari works on iPad and iPhone but has known issues on Mac computers.</div>"
    );
  }

  function chromebookMessage() {
    return (
      '<div style="font-size:18px;font-weight:700;color:#2f5e00;margin-bottom:0.55em;">Chromebook users — Respondus LockDown Browser notice</div>' +
      '<div style="font-size:14px;color:#222;">' +
      "<p style=\"margin:0 0 0.75em 0;\">For students using Chromebooks who have trouble accessing a quiz, review this article on allowing pop-ups: " +
      link(SUPPORT_LINKS.respondusChromebook, "Respondus: Cannot move past the start quiz page") + ".</p>" +
      "<p style=\"margin:0 0 0.75em 0;\">Add <strong style=\"color:#cf2a27;\">" + RESPONDUS_POPUP_URL + "</strong> to your allowed pop-ups. " +
      "Then <strong>restart your Chromebook</strong> and try accessing the quiz again.</p>" +
      "<p style=\"margin:0;\">If you still need help, " + link(SUPPORT_LINKS.elearningBooking, "schedule a time with eLearning") + ".</p>" +
      "</div>"
    );
  }

  function windowsMessage() {
    return (
      '<div style="font-size:16px;font-weight:700;color:#990000;margin-bottom:0.45em;">Windows 10/11 S Mode users — Respondus LockDown Browser notice</div>' +
      '<div style="font-size:14px;color:#222;">' +
      "<p style=\"margin:0 0 0.75em 0;\"><strong>Respondus LockDown Browser notice</strong></p>" +
      "<p style=\"margin:0 0 0.75em 0;\">If you see a message that an app is not Microsoft verified, Windows S Mode may be blocking software installed outside the Microsoft Store.</p>" +
      "<p style=\"margin:0;\">You can turn off S Mode by following Microsoft's guide: " +
      link(SUPPORT_LINKS.windowsSMode, "Switch out of Windows S Mode") + ".</p>" +
      "</div>"
    );
  }

  function displayDeviceMessage() {
    if (!cardEl) return;

    if (isChromebook()) {
      renderCard(chromebookMessage(), "#2f5e00");
      return;
    }

    if (isMacDesktop()) {
      renderCard(macMessage(), "#cc0000");
      return;
    }

    if (isWindows()) {
      renderCard(windowsMessage(), "#990000");
      return;
    }

    hideCard();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", displayDeviceMessage);
  } else {
    displayDeviceMessage();
  }
})();
</script></p>

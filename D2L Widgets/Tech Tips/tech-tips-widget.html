<!--
  Brightspace Tech Tips Widget — Faculty only
  Paste into a D2L HTML widget. Tips are loaded from an org-level Content topic HTML file.
  Configure ORG_UNIT_ID and TOPIC_ID for your institution (example: 1001, 4497966)
-->
<div id="techTipsWidget" style="font-family: Lato, Arial, sans-serif; max-width: 900px; margin: 0 auto;">
<div style="border: 1px solid #e5e5e5; border-radius: 14px; padding: 12px; background: #fff;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px;"><button id="newTipBtn" type="button" style="border: 1px solid #d0d0d0; background: #fff; padding: 6px 10px; border-radius: 999px; cursor: pointer; font-weight: bold; font-size: 13px; line-height: 1;">&nbsp;Click to get a new D2L Tech Tip </button>
<div style="font-size: 12px; color: #777; white-space: nowrap;"></div>
</div>
<div id="tipTitle" style="font-size: 16px; font-weight: 900; margin: 0 0 6px 0;"></div>
<div id="tipBody" style="font-size: 14px; line-height: 1.45; color: #222;"></div>
</div>
<div id="tipError" style="display: none; margin-top: 8px; color: #b00020; font-size: 13px;"></div>
</div>
<p><script>
(function () {
  var ORG_UNIT_ID = 1001;
  var TOPIC_ID = 4497966;
  var LE_VERSION = "1.82";

  var tipTitleEl = document.getElementById("tipTitle");
  var tipBodyEl = document.getElementById("tipBody");
  var tipErrorEl = document.getElementById("tipError");
  var newTipBtn = document.getElementById("newTipBtn");

  var tipsCache = null;

  function showError(msg) {
    tipErrorEl.style.display = "block";
    tipErrorEl.textContent = msg;
  }

  function clearError() {
    tipErrorEl.style.display = "none";
    tipErrorEl.textContent = "";
  }

  async function fetchText(url) {
    var res = await fetch(url, {
      method: "GET",
      credentials: "include",
      headers: { "Accept": "text/html" }
    });
    if (!res.ok) {
      var t = await res.text();
      throw new Error("HTTP " + res.status + " - " + t);
    }
    return res.text();
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function getStrongLabel(pEl) {
    var strong = pEl.querySelector("strong");
    if (!strong) return "";
    return (strong.textContent || "").trim().toLowerCase();
  }

  function extractTextAfterStrong(pEl) {
    var clone = pEl.cloneNode(true);
    var strong = clone.querySelector("strong");
    if (strong) strong.remove();
    return (clone.textContent || "").trim();
  }

  function extractContentHtmlAfterStrong(pEl) {
    var clone = pEl.cloneNode(true);
    var strong = clone.querySelector("strong");
    if (strong) strong.remove();
    return (clone.innerHTML || "").trim();
  }

  function parseTipsFromHtml(html) {
    var doc = document.implementation.createHTMLDocument("");
    doc.documentElement.innerHTML = html;

    var body = doc.body;
    if (!body) return [];

    var ps = body.querySelectorAll("p");
    var tips = [];

    for (var i = 0; i < ps.length; i++) {
      var label = getStrongLabel(ps[i]);

      if (label === "title:" || label === "title") {
        var titleText = extractTextAfterStrong(ps[i]);
        var contentHtml = "";

        if (i + 1 < ps.length) {
          var nextLabel = getStrongLabel(ps[i + 1]);
          if (nextLabel === "content:" || nextLabel === "content") {
            contentHtml = extractContentHtmlAfterStrong(ps[i + 1]);
          }
        }

        if (titleText) {
          tips.push({ title: titleText, contentHtml: contentHtml });
        }
      }
    }

    return tips;
  }

  function renderTip(tip) {
    tipTitleEl.textContent = tip.title || "Tech Tip";
    tipBodyEl.innerHTML = tip.contentHtml || "";
  }

  function avoidImmediateRepeat(tips) {
    if (!tips || tips.length === 0) return null;

    var lastTitle = null;
    try { lastTitle = localStorage.getItem("techTips_lastTitle"); } catch (e) {}

    var chosen = pickRandom(tips);
    if (tips.length > 1 && lastTitle && chosen.title === lastTitle) {
      chosen = pickRandom(tips);
    }

    try { localStorage.setItem("techTips_lastTitle", chosen.title); } catch (e) {}
    return chosen;
  }

  async function loadTip() {
    clearError();
    tipTitleEl.textContent = "Loading…";
    tipBodyEl.innerHTML = "";

    try {
      if (!tipsCache) {
        var fileUrl = "/d2l/api/le/" + LE_VERSION + "/" + ORG_UNIT_ID + "/content/topics/" + TOPIC_ID + "/file";
        var html = await fetchText(fileUrl);

        var tips = parseTipsFromHtml(html);
        if (!tips || tips.length === 0) {
          throw new Error("No tips found. Keep the Title/Content pairs.");
        }

        tipsCache = tips;
      }

      var tip = avoidImmediateRepeat(tipsCache);
      if (!tip) throw new Error("No tips available.");
      renderTip(tip);

    } catch (e) {
      tipTitleEl.textContent = "Couldn't load tip.";
      showError(e.message || String(e));
    }
  }

  newTipBtn.addEventListener("click", function () {
    loadTip();
  });

  loadTip();
})();
</script></p>

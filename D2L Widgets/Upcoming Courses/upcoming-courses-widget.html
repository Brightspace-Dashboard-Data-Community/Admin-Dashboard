<!--
  Brightspace Upcoming Courses Widget
  Paste into a D2L HTML widget. Loads CSVs from the same-origin folder:
  /content/future-courses/

  Checks separate files (does not combine them), e.g.:
  future_courses_26FA.csv, future_courses_27WI.csv, future_courses_27SP.csv, …
  Shows only courses whose stc_start_date is still in the future.
  Semester headings appear only when more than one term is on screen.
  Faculty: myenrollments course offering Code matched to CSV combined field.
-->
<p></p>
<div id="enrollment-widget-container"></div>
<p><script>
/* Brightspace Enrollment Widget — upcoming terms from Manage Files folder */

const ENROLL_CODES = new Set(['A', 'N']);
const CSV_FOLDER = '/content/future-courses/';
const CSV_PREFIX = 'future_courses_';
const TERM_CODES = ['FA', 'WI', 'SP', 'SU'];
const YEAR_SPAN = 5;
const SEASON_LABEL = { FA: 'Fall', WI: 'Winter', SP: 'Spring', SU: 'Summer', SM: 'Summer', SS: 'Spring/Summer' };
const SEASON_ORDER = { WI: 1, SP: 2, SU: 3, SM: 3, SS: 3, FA: 4 };
const MONTHS = {
  january: 0, february: 1, march: 2, april: 3, may: 4, june: 5,
  july: 6, august: 7, september: 8, october: 9, november: 10, december: 11
};

async function BrightspaceFetch(url) {
  const token = localStorage.getItem('XSRF.Token');
  const res = await fetch(url, {
    headers: { 'X-CSRF-Token': token },
    credentials: 'include'
  });
  if (!res.ok) throw new Error('HTTP error! Status: ' + res.status + ' - ' + url);
  return await res.json();
}

function parseCSV(text) {
  const rows = [];
  let row = [], value = '', insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i], nextChar = text[i + 1];
    if (char === '"' && insideQuotes && nextChar === '"') { value += '"'; i++; }
    else if (char === '"') insideQuotes = !insideQuotes;
    else if (char === ',' && !insideQuotes) { row.push(value.trim()); value = ''; }
    else if ((char === '\n' || char === '\r') && !insideQuotes) {
      if (value || row.length) { row.push(value.trim()); rows.push(row); row = []; value = ''; }
      if (char === '\r' && nextChar === '\n') i++;
    } else value += char;
  }
  if (value || row.length) { row.push(value.trim()); rows.push(row); }

  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.trim().replace(/^\uFEFF/, '').replace(/^"|"$/g, '').toLowerCase());

  return rows.filter(r => r.some(c => String(c || '').trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = String(r[i] || '').replace(/^"|"$/g, '').trim(); });
    return obj;
  });
}

function lc(s) { return String(s || '').toLowerCase().trim(); }

function resolveColumns(row) {
  const keys = Object.keys(row || {});
  const find = function () {
    const preds = arguments;
    return keys.find(k => {
      const key = lc(k);
      for (let i = 0; i < preds.length; i++) if (preds[i](key)) return true;
      return false;
    }) || null;
  };
  return {
    personId: find(k => k === 'stc_person_id', k => k === 'person_id'),
    facultyId: find(k => k === 'faculty_id', k => k === 'stc_faculty_id'),
    term: find(k => k === 'stc_term', k => k === 'term'),
    status: find(k => k === 'stc_current_status', k => k === 'status'),
    statusDate: find(
      k => k === 'stc_current_status_date',
      k => k === 'stc_status_date',
      k => k.includes('status') && k.includes('date')
    ),
    startDate: find(k => k === 'stc_start_date', k => k.includes('start') && k.includes('date')),
    endDate: find(k => k === 'stc_end_date', k => k.includes('end') && k.includes('date')),
    title: find(k => k === 'stc_title', k => k === 'sec_title'),
    courseName: find(k => k === 'stc_course_name', k => k === 'course_name'),
    sectionNo: find(k => k === 'stc_section_no', k => k === 'section'),
    combined: find(k => k.startsWith('combined'), k => k === 'sec_name'),
    facultyName: find(k => k === 'faculty_name', k => k.endsWith('faculty_name'), k => k.includes('faculty_name'))
  };
}

function val(row, key) {
  return key ? String(row[key] || '').trim() : '';
}

function normalizeRow(row, cols) {
  const courseName = val(row, cols.courseName);
  const sectionNo = val(row, cols.sectionNo);
  const term = val(row, cols.term);
  let combined = val(row, cols.combined);
  if (!combined && courseName && sectionNo && term) combined = courseName + '-' + sectionNo + '-' + term;
  else if (!combined && courseName && sectionNo) combined = courseName + '-' + sectionNo;
  return {
    person_id: val(row, cols.personId),
    faculty_id: val(row, cols.facultyId),
    term: term,
    status: val(row, cols.status),
    status_date: val(row, cols.statusDate),
    start_date: val(row, cols.startDate),
    end_date: val(row, cols.endDate),
    title: val(row, cols.title),
    course_name: courseName,
    section: sectionNo,
    combined: combined,
    faculty_name: val(row, cols.facultyName)
  };
}

function orgDefinedIdCandidates(raw) {
  const digits = String(raw ?? '').replace(/\D/g, '');
  if (!digits) return [];
  const trimmed = digits.replace(/^0+/, '') || '0';
  const set = new Set([digits, trimmed]);
  for (const len of [7, 8, 9, 10]) set.add(trimmed.padStart(len, '0'));
  return [...set];
}

function idsMatch(csvId, orgDefinedId) {
  const a = new Set(orgDefinedIdCandidates(csvId));
  const b = new Set(orgDefinedIdCandidates(orgDefinedId));
  for (const id of a) if (b.has(id)) return true;
  return false;
}

function normalizeId(raw) {
  return String(raw ?? '').replace(/\D/g, '').replace(/^0+/, '') || '';
}

function toDate(dateStr) {
  const s = String(dateStr || '').trim();
  if (!s) return new Date(0);
  const dt = new Date(s);
  if (!isNaN(dt.getTime())) return dt;
  const mdy = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);
  if (mdy) {
    let yy = parseInt(mdy[3], 10);
    if (mdy[3].length === 2) yy += yy >= 70 ? 1900 : 2000;
    return new Date(yy, parseInt(mdy[1], 10) - 1, parseInt(mdy[2], 10));
  }
  const long = /^(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2}),?\s+(\d{4})/i.exec(s);
  if (long) return new Date(parseInt(long[3], 10), MONTHS[long[1].toLowerCase()], parseInt(long[2], 10));
  return new Date(0);
}

function isEnrolledStatus(status) {
  return ENROLL_CODES.has(String(status || '').toUpperCase().trim());
}

function isFutureStart(row) {
  const start = toDate(row.start_date);
  if (!row.start_date || isNaN(start.getTime()) || start.getTime() === 0) return false;
  return start.getTime() > Date.now();
}

function parseTerm(term) {
  const m = /^(\d{2})\/(FA|WI|SP|SU|SM|SS)/i.exec(String(term || '').trim());
  if (!m) return null;
  return { yy: parseInt(m[1], 10), season: m[2].toUpperCase() };
}

function termSortKey(term) {
  const p = parseTerm(term);
  if (!p) return 999999;
  return p.yy * 10 + (SEASON_ORDER[p.season] || 9);
}

function termLabel(term) {
  const p = parseTerm(term);
  if (!p) return String(term || 'Upcoming').trim() || 'Upcoming';
  return (SEASON_LABEL[p.season] || p.season) + ' ' + String(p.yy).padStart(2, '0');
}

function uniqueTerms(rows) {
  const set = new Set(rows.map(r => String(r.term || '').trim()).filter(Boolean));
  return [...set].sort((a, b) => termSortKey(a) - termSortKey(b));
}

function latestEnrolledRows(rows, idField) {
  const groups = new Map();
  rows.forEach(row => {
    const id = normalizeId(row[idField]);
    const sec = String(row.combined || '').trim();
    const term = String(row.term || '').trim();
    if (!id || !sec || !term) return;
    const key = id + '|' + sec + '|' + term;
    (groups.get(key) || groups.set(key, []).get(key)).push(row);
  });
  const latest = [];
  for (const arr of groups.values()) {
    arr.sort((a, b) => toDate(b.status_date) - toDate(a.status_date));
    if (isEnrolledStatus(arr[0].status)) latest.push(arr[0]);
  }
  latest.sort((a, b) => {
    const t = termSortKey(a.term) - termSortKey(b.term);
    return t || String(a.title || '').localeCompare(String(b.title || ''));
  });
  return latest.filter(isFutureStart);
}

const INSTRUCTOR_ROLE_ID = 102;
const COURSE_OFFERING_TYPE_ID = 3;

async function fetchMyEnrollments() {
  const items = [];
  let bookmark = '';
  let guard = 0;
  while (guard++ < 50) {
    const url = '/d2l/api/lp/1.51/enrollments/myenrollments/?pageSize=100' +
      (bookmark ? '&bookmark=' + encodeURIComponent(bookmark) : '');
    const page = await BrightspaceFetch(url);
    items.push.apply(items, page.Items || []);
    const pi = page.PagingInfo || {};
    if (!pi.HasMoreItems || !pi.Bookmark) break;
    bookmark = pi.Bookmark;
  }
  return items;
}

function isInstructorEnrollment(item) {
  const t = item && item.OrgUnit && item.OrgUnit.Type ? item.OrgUnit.Type : {};
  if (!(t.Id === COURSE_OFFERING_TYPE_ID || t.Code === 'Course Offering')) return false;
  const access = item.Access || {};
  if (access.RoleId === INSTRUCTOR_ROLE_ID) return true;
  const name = String(access.ClasslistRoleName || '').toLowerCase();
  return name.indexOf('instructor') !== -1 || name.indexOf('teacher') !== -1;
}

async function getInstructorOfferings() {
  const items = await fetchMyEnrollments();
  const out = [];
  items.forEach(item => {
    if (!isInstructorEnrollment(item)) return;
    const ou = item.OrgUnit || {};
    if (!ou.Id) return;
    out.push({ orgUnitId: ou.Id, code: ou.Code || '', name: ou.Name || '' });
  });
  return out;
}

function attachStudentCourseLinks(rows, enrollments) {
  const offerings = [];
  enrollments.forEach(item => {
    const t = item && item.OrgUnit && item.OrgUnit.Type ? item.OrgUnit.Type : {};
    if (!(t.Id === COURSE_OFFERING_TYPE_ID || t.Code === 'Course Offering')) return;
    const access = item.Access || {};
    if (typeof access.CanAccess === 'boolean' && !access.CanAccess) return;
    const ou = item.OrgUnit || {};
    if (!ou.Id) return;
    offerings.push({ orgUnitId: ou.Id, code: ou.Code || '' });
  });
  return rows.map(row => {
    const off = offerings.find(o => codesMatch(o.code, row.combined));
    if (!off) return row;
    return Object.assign({}, row, {
      courseHref: '/d2l/home/' + off.orgUnitId,
      orgUnitId: off.orgUnitId
    });
  });
}

function normalizeCode(s) {
  return String(s || '').trim().toUpperCase().replace(/\s+/g, '');
}

function codesMatch(offeringCode, combined) {
  const a = normalizeCode(offeringCode);
  const b = normalizeCode(combined);
  if (!a || !b) return false;
  if (a === b) return true;
  return a.indexOf(b) === 0 || b.indexOf(a) === 0;
}

function uniqueUpcomingByCombined(rows) {
  const groups = new Map();
  rows.forEach(row => {
    const sec = String(row.combined || '').trim();
    const term = String(row.term || '').trim();
    if (!sec || !term) return;
    const key = normalizeCode(sec) + '|' + term;
    (groups.get(key) || groups.set(key, []).get(key)).push(row);
  });
  const latest = [];
  for (const arr of groups.values()) {
    arr.sort((a, b) => toDate(b.status_date) - toDate(a.status_date));
    if (isEnrolledStatus(arr[0].status) && isFutureStart(arr[0])) latest.push(arr[0]);
  }
  return latest;
}

function matchFacultyToCsv(csvRows, offerings) {
  const sections = uniqueUpcomingByCombined(csvRows);
  const matched = [];
  const seen = new Set();
  offerings.forEach(off => {
    const hit = sections.find(row => codesMatch(off.code, row.combined));
    if (!hit) return;
    const key = normalizeCode(hit.combined) + '|' + hit.term;
    if (seen.has(key)) return;
    seen.add(key);
    matched.push(Object.assign({}, hit, {
      courseHref: '/d2l/home/' + off.orgUnitId,
      orgUnitId: off.orgUnitId
    }));
  });
  matched.sort((a, b) => {
    const t = termSortKey(a.term) - termSortKey(b.term);
    return t || String(a.title || '').localeCompare(String(b.title || ''));
  });
  return matched;
}

function parseFacultyName(name) {
  if (!name || !String(name).trim()) return 'TBA';
  return String(name).split(/\s*-\s*/).map(instr => {
    const parts = instr.split(',').map(p => p.trim());
    return parts.length >= 2 ? parts[1] + ' ' + parts[0] : instr;
  }).join(', ');
}

function formatDate(dateStr) {
  if (!dateStr) return 'TBA';
  const d = toDate(dateStr);
  return isNaN(d.getTime()) || d.getTime() === 0 ? dateStr : d.toLocaleDateString();
}

function renderCourseList(rows, showInstructor) {
  let html = '<ul style="list-style:none; padding-left:0;">';
  rows.forEach(row => {
    const titleText = row.title || 'Untitled Course';
    const titleHtml = row.courseHref
      ? '<a href="' + row.courseHref + '" style="color:#0077cc;text-decoration:none;"><strong>' + titleText + '</strong></a>'
      : '<strong>' + titleText + '</strong>';
    html += '<li style="margin-bottom:1em; padding:0.5em; background:#f9f9f9; border-left:4px solid #0077cc;">' +
      titleHtml + '<br>' +
      (row.combined || 'Course section unavailable') + '<br>' +
      'Starts: ' + formatDate(row.start_date) + '<br>' +
      'Ends: ' + formatDate(row.end_date) +
      (showInstructor ? '<br>Instructor: ' + parseFacultyName(row.faculty_name) : '') +
      '</li>';
  });
  return html + '</ul>';
}

function renderGroupedCourses(rows, showInstructor) {
  const terms = uniqueTerms(rows);
  if (terms.length <= 1) return renderCourseList(rows, showInstructor);
  return terms.map(term => {
    const group = rows.filter(r => String(r.term || '').trim() === term);
    return '<section style="margin-bottom:1.25em;">' +
      '<h3 style="font-size:0.95em;margin:0 0 0.5em;color:#0077cc;">' + termLabel(term) + '</h3>' +
      renderCourseList(group, showInstructor) +
      '</section>';
  }).join('');
}

function headingFor(rows, isFaculty) {
  const terms = uniqueTerms(rows);
  if (terms.length === 1) return termLabel(terms[0]) + (isFaculty ? ' Courses' : ' Enrollments');
  return isFaculty ? 'Upcoming Courses' : 'Upcoming Enrollments';
}

function folderUrl() {
  return CSV_FOLDER.endsWith('/') ? CSV_FOLDER : CSV_FOLDER + '/';
}

function looksLikeCsv(text) {
  const s = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!s || s.charAt(0) === '<') return false;
  const first = s.split(/\r?\n/, 1)[0] || '';
  return first.indexOf(',') !== -1;
}

function conventionFilenames() {
  const y = new Date().getFullYear() % 100;
  const names = [];
  for (let i = 0; i < YEAR_SPAN; i++) {
    const ys = String((y + i) % 100).padStart(2, '0');
    for (let t = 0; t < TERM_CODES.length; t++) names.push(CSV_PREFIX + ys + TERM_CODES[t] + '.csv');
  }
  return names;
}

function csvPath(name) {
  return folderUrl() + name;
}

function discoverCsvUrls() {
  return conventionFilenames().map(csvPath);
}

async function loadFolderRows() {
  const urls = discoverCsvUrls();
  const results = await Promise.all(urls.map(async url => {
    try {
      const res = await fetch(url, { cache: 'no-store', credentials: 'include' });
      if (res.status === 404) return { url: url, ok: false, reason: '404' };
      if (!res.ok) return { url: url, ok: false, reason: 'HTTP ' + res.status };
      const text = await res.text();
      if (!looksLikeCsv(text)) return { url: url, ok: false, reason: 'not CSV (login page or HTML)' };
      const parsed = parseCSV(text);
      if (!parsed.length) return { url: url, ok: false, reason: 'empty CSV' };
      const cols = resolveColumns(parsed[0] || {});
      if (!cols.personId) return { url: url, ok: false, reason: 'missing stc_person_id column' };
      return { url: url, ok: true, rows: parsed.map(r => normalizeRow(r, cols)) };
    } catch (e) {
      return { url: url, ok: false, reason: e.message || 'fetch failed' };
    }
  }));

  const rows = [];
  results.forEach(item => {
    if (item.ok) rows.push.apply(rows, item.rows);
  });
  if (rows.length) return rows;

  const faName = CSV_PREFIX + String(new Date().getFullYear() % 100).padStart(2, '0') + 'FA.csv';
  const fa = results.find(item => item.url.indexOf(faName) !== -1) || results[0];
  const detail = fa ? (fa.url + ' — ' + fa.reason) : 'no files checked';
  throw new Error('Could not read enrollment CSV. ' + detail);
}

(function () {
  const container = document.getElementById('enrollment-widget-container');
  (async () => {
    try {
      const whoami = await BrightspaceFetch('/d2l/api/lp/1.51/users/whoami');
      const blockedUsers = ['admin.username', 'another.user']; // Optional: hide widget for test accounts
      if (blockedUsers.includes(whoami.UniqueName)) return;

      let orgDefinedId = null;
      try {
        const user = await BrightspaceFetch('/d2l/api/lp/1.49/users/' + whoami.Identifier);
        orgDefinedId = String(user.OrgDefinedId || '').trim();
      } catch (err) { console.warn('Could not load OrgDefinedId:', err.message); }

      const rows = await loadFolderRows();
      let instructorOfferings = [];
      try {
        instructorOfferings = await getInstructorOfferings();
      } catch (err) {
        console.warn('Could not load myenrollments:', err);
      }

      if (instructorOfferings.length > 0) {
        const facultyRows = matchFacultyToCsv(rows, instructorOfferings);
        container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
          '<h2 style="font-size:1em;margin-bottom:0.5em;">' + headingFor(facultyRows, true) + '</h2>' +
          '<div id="course-results" style="font-size:0.95em;color:#333;"></div>' +
          '<p style="margin-top:1.5em;">📝 <a href="Textbook requisition" target="_blank" style="color:#0077cc;text-decoration:none;">Submit Faculty Book Orders</a></p></div>';
        document.getElementById('course-results').innerHTML = facultyRows.length === 0
          ? '<p>No upcoming courses found.</p>'
          : renderGroupedCourses(facultyRows, false);
        return;
      }

      if (!orgDefinedId) {
        container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
          '<h2 style="font-size:1em;margin-bottom:0.5em;">Upcoming Enrollments</h2>' +
          '<p>No upcoming courses found.</p></div>';
        return;
      }

      const studentRows = latestEnrolledRows(
        rows.filter(row => idsMatch(row.person_id, orgDefinedId)),
        'person_id'
      );
      let studentRowsToShow = studentRows;
      try {
        studentRowsToShow = attachStudentCourseLinks(studentRows, await fetchMyEnrollments());
      } catch (err) {
        console.warn('Could not attach student course links:', err);
      }

      container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
        '<h2 style="font-size:1em;margin-bottom:0.5em;">' + headingFor(studentRowsToShow, false) + '</h2>' +
        '<div id="course-results" style="font-size:0.95em;color:#333;"></div>' +
        '<p style="margin-top:1.5em;">📚 <a href="https://bookstore.yourcollege.edu/buy_textbooks.asp" target="_blank" style="color:#0077cc;text-decoration:none;">Buy Books</a><br>Available for purchase starting <strong>August 10th, 2026</strong>.</p></div>';

      const output = document.getElementById('course-results');
      output.innerHTML = studentRowsToShow.length === 0
        ? '<p>No upcoming courses found.</p>'
        : renderGroupedCourses(studentRowsToShow, true);

    } catch (error) {
      console.error('Upcoming Courses widget:', error);
      container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
        '<h2 style="font-size:1em;margin-bottom:0.5em;">Upcoming Enrollments</h2>' +
        '<p>No upcoming courses found.</p></div>';
    }
  })();
})();
</script></p>

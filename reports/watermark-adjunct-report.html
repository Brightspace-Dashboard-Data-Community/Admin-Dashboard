<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Adjunct Report - D2L Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/components.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #f0f0f0;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: var(--spacing-md);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background-color: #e0e0e0;
            transform: translateX(-2px);
        }

        .page-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
        }

        .input-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .input-group input[type="file"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            width: 100%;
            max-width: 520px;
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .card {
            margin-bottom: var(--spacing-xl);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="mobile-toggle">
                    <button id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
                </div>
                <div>
                    <a href="../reports-tools.html" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i> Back to Reports & Tools
                    </a>
                    <h1 class="page-title">Watermark Adjunct Report</h1>
                    <p class="page-subtitle">
                        Upload a CSV containing <strong>OrgDefinedId</strong>. This tool looks up each ID in D2L and exports a CSV with columns <strong>Username</strong> and <strong>MDU_Status</strong> (set to <strong>Adjunct</strong>).
                    </p>
                </div>
            </header>

            <div class="card">
                <h2 style="margin-top: 0; color: var(--primary-color);">Generate Report</h2>
                <div class="input-group">
                    <label for="orgDefinedIdFile">
                        <i class="fas fa-file-csv"></i> Upload CSV (must include OrgDefinedId)
                    </label>
                    <input type="file" id="orgDefinedIdFile" accept=".csv">
                </div>
                <div class="input-group">
                    <label for="secDivisionFile">
                        <i class="fas fa-file-csv"></i> Upload SEC Division CSV (SEC_DIVISIONS, CSF_FACULTY)
                    </label>
                    <input type="file" id="secDivisionFile" accept=".csv">
                </div>
                <div class="form-actions">
                    <button id="runWatermarkReportBtn" class="btn-primary">
                        <i class="fas fa-rocket"></i> Run Report
                    </button>
                    <button id="downloadWatermarkCsvBtn" class="btn-secondary" style="display:none;">
                        <i class="fas fa-download"></i> Download CSV
                    </button>
                </div>
                <div id="watermarkResults" style="margin-top: var(--spacing-md);"></div>
            </div>
        </main>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/d2l-api.js"></script>
    <script src="../js/loading-utils.js"></script>
    <script src="../js/watermark-adjunct-report.js"></script>
</body>

</html>

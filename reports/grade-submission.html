<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submission Report - D2L Admin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/components.css">

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #f0f0f0;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: var(--spacing-md);
            margin-left: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: visible;
        }

        .back-link:hover {
            background-color: #e0e0e0;
            transform: translateX(-2px);
        }

        .page-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
        }

        .input-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-primary);
        }

        .input-group input[type="file"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            width: 100%;
            max-width: 400px;
        }

        .status-message {
            margin: var(--spacing-md) 0;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            display: none;
            font-size: var(--font-size-sm);
            background-color: #e8f4fd;
            border: 1px solid #c5e0fa;
            color: #0366d6;
        }

        table.display {
            width: 100%;
            border-collapse: collapse;
        }

        table.display th,
        table.display td {
            border: 1px solid var(--border-color);
            padding: var(--spacing-sm);
            text-align: left;
            font-size: var(--font-size-sm);
        }

        table.display th {
            background: var(--bg-color);
            font-weight: 600;
        }

        /* Card spacing - consistent spacing between cards */
        .card {
            margin-bottom: var(--spacing-xl);
        }

        .card:last-child {
            margin-bottom: 0;
        }

        /* Button Styles - Consistent with design system */
        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }

        /* Table styling - better organization and readability */
        #resultsTable {
            width: 100% !important;
        }

        #resultsTable thead th {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-weight: 600;
            padding: 12px 8px;
            border-bottom: 2px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
        }

        #resultsTable tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        #resultsTable tbody tr {
            background-color: var(--surface-color);
        }

        #resultsTable tbody tr:hover {
            background-color: var(--bg-color);
        }

        #resultsTable tbody tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.02);
        }

        #resultsTable tbody tr:nth-child(even):hover {
            background-color: var(--bg-color);
        }

        /* DataTables pagination styling */
        .dataTables_wrapper .dataTables_paginate {
            margin-top: var(--spacing-md);
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            padding: 6px 12px;
            margin: 0 2px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--surface-color);
            color: var(--text-primary) !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background-color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background-color: var(--primary-color);
            color: white !important;
            border-color: var(--primary-color);
        }

        .dataTables_wrapper .dataTables_length select,
        .dataTables_wrapper .dataTables_filter input {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        .dataTables_wrapper .dataTables_info {
            color: var(--text-secondary);
            padding-top: var(--spacing-sm);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (injected via js/sidebar.js) -->

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="mobile-toggle">
                    <button id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
                </div>
                <div>
                    <a href="../reports-tools.html" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i> Back to Reports & Tools
                    </a>
                    <h1 class="page-title">Grade Submission Report</h1>
                    <p class="page-subtitle">Upload a CSV from the Course Log Deep Scan to generate the grade submission status for each course.</p>
                </div>
            </header>

            <div class="card">
                <div class="input-group">
                    <label for="csvFile">Upload CSV File</label>
                    <input type="file" id="csvFile" accept=".csv">
                </div>
                <div class="form-actions">
                    <button id="processFileBtn" class="btn-primary">
                        <i class="fas fa-file-alt"></i> Process File
                    </button>
                    <button id="downloadReportBtn" class="btn-secondary" style="display:none;">
                        <i class="fas fa-download"></i> Download Report
                    </button>
                </div>

                <div id="status" class="status-message"></div>
            </div>

            <div class="card" id="resultsCard" style="display: none;">
                <h2 style="margin-top: 0;">Submission Report</h2>
                <table id="resultsTable" class="display" style="width:100%">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Course ID</th>
                            <th>Course Code</th>
                            <th>Course Name</th>
                            <th>Log Link</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/app.js"></script>
    <!-- D2L API - Must be loaded first -->
    <script src="../js/d2l-api.js"></script>
    <script src="../js/loading-utils.js"></script>
    <script src="../js/grade-submission.js"></script>
</body>

</html>

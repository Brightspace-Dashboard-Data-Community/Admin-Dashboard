<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Dates to CSV - D2L Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #f0f0f0;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: var(--spacing-md);
            margin-left: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: visible;
        }

        .back-link:hover {
            background-color: #e0e0e0;
            transform: translateX(-2px);
        }

        .page-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .field {
            margin-bottom: var(--spacing-md);
        }

        .field label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .field input[type="file"],
        .field input[type="url"] {
            width: 100%;
            max-width: 500px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        /* Button Styles - Consistent with design system */
        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Card spacing - consistent spacing between cards */
        .card {
            margin-bottom: var(--spacing-xl);
        }

        .card:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="mobile-toggle"><button id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button></div>
                <div>
                    <a href="../reports-tools.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Reports & Tools</a>
                    <h1 class="page-title">Semester Dates Report</h1>
                    <p class="page-subtitle">Upload a PDF or enter its URL to generate a CSV of courses and final grades due dates.</p>
                </div>
            </header>
            <div class="card">
                <h2>Upload PDF</h2>
                <div class="field"><label for="pdfFile">PDF File:</label><input type="file" id="pdfFile" accept=".pdf"></div>
                <div class="field"><label for="pdfUrl">Or PDF URL:</label><input type="url" id="pdfUrl" placeholder="https://.../important-semester-dates.pdf"></div>
                <button id="generateBtn" class="btn-primary"><i class="fas fa-play"></i> Generate Report</button>
                <button id="downloadBtn" class="btn-secondary" style="display:none;"><i class="fas fa-download"></i> Download CSV</button>
                <div id="loadingContainer"></div>
            </div>
            <div class="card">
                <h2>Report Results</h2>
                <p><strong>Total Courses:</strong> <span id="totalCourses">0</span></p>
                <table id="resultsTable" class="display" style="width:100%">
                    <thead><tr><th>Course</th><th>Final Grades Due</th></tr></thead>
                    <tbody id="resultsBody"><tr><td colspan="2" style="text-align: center; padding: 2rem;">Generate a report to see results here.</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="../js/sidebar.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/d2l-api.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="../js/loading-utils.js"></script>
    <script src="../js/semester-dates-to-csv.js"></script>
</body>
</html>

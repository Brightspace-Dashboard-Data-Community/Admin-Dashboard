<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Statistics Report - D2L Admin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/components.css">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #f0f0f0;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: var(--spacing-md);
            margin-left: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: visible;
        }

        .back-link:hover {
            background-color: #e0e0e0;
            transform: translateX(-2px);
        }

        .page-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .input-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-primary);
        }

        .input-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        .status-message {
            margin-top: var(--spacing-md);
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Button Styles - Consistent with design system */
        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }

        /* Card spacing - consistent spacing between cards */
        .card {
            margin-bottom: var(--spacing-xl);
        }

        .card:last-child {
            margin-bottom: 0;
        }

        /* Table styling - better organization and readability */
        #enrollmentTable {
            width: 100% !important;
        }

        #enrollmentTable thead th {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-weight: 600;
            padding: 12px 8px;
            border-bottom: 2px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
        }

        #enrollmentTable tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        #enrollmentTable tbody tr {
            background-color: var(--surface-color);
        }

        #enrollmentTable tbody tr:hover {
            background-color: var(--bg-color);
        }

        #enrollmentTable tbody tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.02);
        }

        #enrollmentTable tbody tr:nth-child(even):hover {
            background-color: var(--bg-color);
        }

        /* Style for TOTAL row */
        #enrollmentTable tbody tr.total-row {
            background-color: rgba(26, 93, 26, 0.1) !important;
            font-weight: 600;
        }

        #enrollmentTable tbody tr.total-row td {
            border-top: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        /* Better text wrapping for long course names */
        #enrollmentTable tbody td:nth-child(2),
        #enrollmentTable tbody td:nth-child(3) {
            max-width: 300px;
            word-wrap: break-word;
            word-break: break-word;
        }

        /* DataTables pagination styling */
        .dataTables_wrapper .dataTables_paginate {
            margin-top: var(--spacing-md);
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            padding: 6px 12px;
            margin: 0 2px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--surface-color);
            color: var(--text-primary) !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background-color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background-color: var(--primary-color);
            color: white !important;
            border-color: var(--primary-color);
        }

        .dataTables_wrapper .dataTables_length select,
        .dataTables_wrapper .dataTables_filter input {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        .dataTables_wrapper .dataTables_info {
            color: var(--text-secondary);
            padding-top: var(--spacing-sm);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (injected via js/sidebar.js) -->

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="mobile-toggle">
                    <button id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
                </div>
                <div>
                    <a href="../reports-tools.html" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i> Back to Reports & Tools
                    </a>
                    <h1 class="page-title">Enrollment Statistics Report</h1>
                    <p class="page-subtitle">View enrollment totals by role and division for a selected semester.</p>
                </div>
            </header>

            <div class="card">
                <div class="input-row">
                    <div class="input-group">
                        <label for="semesterSelect"><strong>Select a Semester:</strong></label>
                        <select id="semesterSelect"></select>
                    </div>
                </div>
                <div class="form-actions">
                    <button id="runReport" class="btn-primary">
                        <i class="fas fa-sync-alt"></i> Run Report
                    </button>
                    <button id="downloadCsv" class="btn-secondary" disabled>
                        <i class="fas fa-download"></i> Download CSV
                    </button>
                </div>

                <div id="statusMessage" class="status-message"></div>
            </div>

            <div class="card" style="margin-top: var(--spacing-lg);">
                <table id="enrollmentTable" class="display" style="width:100%">
                    <thead>
                        <tr>
                            <th>Semester</th>
                            <th>Course Code</th>
                            <th>Course Name</th>
                            <th>OrgUnitId</th>
                            <th>Division</th>
                            <th>Status</th>
                            <th>Total Faculty</th>
                            <th>Total Student</th>
                            <th>Total Other</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/app.js"></script>
    <!-- D2L API - Must be loaded first -->
    <script src="../js/d2l-api.js"></script>
    <script src="../js/semester-config.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="../js/loading-utils.js"></script>
    <script src="../js/enrollment-statistics.js"></script>
</body>

</html>
